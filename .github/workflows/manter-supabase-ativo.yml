name: Manter Supabase ativo

# O plano gratuito do Supabase pausa o projeto após 7 dias sem uso.
# Esta consulta de baixo custo consulta o banco (função public.ping) para evitar a pausa.
on:
  schedule:
    - cron: "0 12 * * 1,4" # segunda e quinta, 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        run: |
          curl --fail --silent --show-error -X POST \
            "https://lavcrgenirayjcxsgomc.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_c4sMdfEu2UMMRcqTzNXVuw_6gt_U7JV" \
            -H "Content-Type: application/json" -d '{}'
